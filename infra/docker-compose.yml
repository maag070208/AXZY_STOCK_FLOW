# ============================================================================
# docker-compose del Almacén Integral — Fase 0
#
# REGLA DE SEGURIDAD: este archivo NO contiene credenciales.
# Los valores vienen de `infra/.env`, que está en el .gitignore.
# El hallazgo S5 del legacy era exactamente credenciales en el repositorio
# (SQL Server, MySQL, admin/admin12345): ese defecto no se repite.
#
# Para arrancar:
#   cd infra && cp .env.example .env   # y editar las claves
#   docker compose up -d
# ============================================================================

name: stock

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en infra/.env}
      # Collation determinista: los códigos de producto y ubicación se comparan
      # y ordenan como texto, y un collation dependiente del locale puede hacer
      # que 'ABRAA1B' y 'abr aa1b' se consideren iguales en un índice único.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      # Solo en loopback: la base de datos de desarrollo no debe quedar expuesta
      # a la red local. El backend corre en el host, así que no necesita bind público.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-q` y no `-c "SELECT 1"`: se comprueba que la base acepta CONEXIONES,
      # no solo que el proceso esté vivo.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      # Los valores por defecto de Postgres son conservadores para un servidor
      # de desarrollo. Estos permiten ver el plan de consultas y detectar el
      # N+1 que el legacy tenía por todas partes.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "timezone=UTC"

  # Visor de la base de datos. Alternativa local a instalar psql.
  # Se expone SOLO en loopback por la misma razón que Postgres.
  adminer:
    image: adminer:4
    container_name: stock-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

volumes:
  postgres-data:
    name: stock-postgres-data
