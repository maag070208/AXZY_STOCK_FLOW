distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned version. Do NOT use 'latest': the build must be reproducible.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
# No distributionSha256Sum is pinned, so the downloaded Gradle distribution is not checked against a checksum.
# Pin the official one (gradle-9.3.1-bin.zip.sha256) so that a mismatching download fails instead of running a modified binary.
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
