distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Versión fijada. NO usar 'latest': el build debe ser reproducible.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
# Checksum verificado contra el oficial de Gradle (gradle-9.1.0-bin.zip.sha256).
# Si la descarga no coincide, el wrapper FALLA en lugar de ejecutar un binario
# manipulado. Es la misma disciplina que aplicamos a los secretos: no confiar
# en lo que no se ha verificado.
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
