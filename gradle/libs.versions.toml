[versions]
kotlin = "2.1.20"
coroutines = "1.10.1"
serialization = "1.8.0"
datetime = "0.6.2"
# Tests
kotest = "5.9.1"
# Calidad
detekt = "1.23.8"
# Solo para el backend (ver la guardia de arquitectura: stock-domain NO los usa)
exposed = "0.59.0"
ktor = "3.1.1"
postgresql = "42.7.5"
hikari = "6.2.1"
flyway = "11.3.4"
logback = "1.5.16"
koin = "4.0.4"
argon2 = "2.12"
jwt = "4.6.1"
# Android Gradle Plugin. Solo se aplica si se activan los targets moviles.
#
# AGP 9 en lugar de 8.x: aporta `com.android.kotlin.multiplatform.library`, el
# plugin que integra el target de Android DENTRO del bloque `kotlin {}` de un
# modulo KMP. Con AGP 8 habia que aplicar `com.android.library` aparte, que no
# soporta KMP de forma nativa. Verificado contra el ejemplo de PuertoNuevoApp,
# que ya usa AGP 9 en produccion.
androidGradlePlugin = "9.0.1"
androidMinSdk = "24"
androidCompileSdk = "36"

# Compose Multiplatform para la UI compartida de Android e iOS.
composeMultiplatform = "1.11.1"
# Camara y lectura de codigos de barras, solo en androidMain.
androidxCamera = "1.4.2"
mlkitBarcode = "17.3.0"

[libraries]
# ═══════════════════════════════════════════════════════════════════════════
# ATENCIÓN: los nombres de estas claves NO pueden empezar por "kotlin-".
# El version catalog genera un namespace `libs.kotlin.*` para el plugin
# `kotlin`, y una librería `kotlin-coroutines-core` produciría el accessor
# `libs.kotlin.coroutines.core`, que colisiona y rompe el build.
# ═══════════════════════════════════════════════════════════════════════════

# ── Kotlin core: lo ÚNICO que stock-domain puede usar ──────────────────────
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# ── Movil: escaner de codigos de barras ────────────────────────────────────
# La camara y el lector de codigos son de PLATAFORMA, por eso van en androidMain
# y en iosMain; el modelo de que hacer con lo escaneado vive en commonMain.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

# ── Tests: property-based para las invariantes I1-I10 ──────────────────────
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.0" }

# ── Backend: Ktor ──────────────────────────────────────────────────────────
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-request-validation = { module = "io.ktor:ktor-server-request-validation", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }

# ── Backend: Exposed y persistencia ────────────────────────────────────────
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }

# ── Móvil: Ktor client ─────────────────────────────────────────────────────
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# Plugin de Android para modulos KMP (AGP 9). Reemplaza a `com.android.library`,
# que no soporta Kotlin Multiplatform de forma nativa.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
