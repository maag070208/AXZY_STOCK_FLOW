[versions]
# ── Kotlin: 2.4.10, la version del ejemplo REAL de PuertoNuevoApp ──────────
#
# POR QUE SUBIO DE 2.1.20 A 2.4.10 (realizado al construir la app movil)
#
# Compose Multiplatform 1.11.1 aborta la configuracion con «Minimal supported
# Kotlin Gradle Plugin version is 2.2.0» — verificado en esta maquina con una
# sonda Gradle minima, no supuesto. Y no se puede tener dos versiones del plugin
# de Kotlin en el mismo build: el `build.gradle.kts` raiz lo pone en el classpath
# del build con `apply false`, y Gradle responde
#
#   «The request for this plugin could not be satisfied because the plugin is
#    already on the classpath with a different version (2.1.20)»
#
# en cuanto un subproyecto pide otra. Es decir, o suben los seis modulos o el
# movil no compila: no hay convivencia posible.
#
# El salto es de compilador, no de lenguaje: Kotlin solo es retrocompatible
# leyendo artefactos de versiones ANTERIORES, asi que 2.4.10 compila
# stock-domain, stock-network, stock-datastore, stock-database y backend sin
# cambios. Verificado con `:stock-domain:jvmTest` (56 tests) despues del cambio.
#
# Kotlin/Native 2.4.10 se descarga aparte en KONAN_DATA_DIR: el que habia
# instalado (2.1.20) no sirve para compilar con el compilador 2.4.10.
kotlin = "2.4.10"
coroutines = "1.10.1"
serialization = "1.8.0"
datetime = "0.6.2"
# Tests
kotest = "5.9.1"
# Calidad
detekt = "1.23.8"
# Solo para el backend (ver la guardia de arquitectura: stock-domain NO los usa)
exposed = "0.59.0"
ktor = "3.1.1"
postgresql = "42.7.5"
hikari = "6.2.1"
flyway = "11.3.4"
logback = "1.5.16"
koin = "4.0.4"
argon2 = "2.12"
# JNA: los bindings nativos. Se declara EXPLICITAMENTE porque JNA no llega
# como dependencia transitiva de argon2-jvm, y hace falta para llamar a la
# libreria nativa (el binding de Java de argon2-jvm esta roto: ver
# NativeArgon2PasswordHasher).
jna = "5.17.0"
jwt = "4.6.1"
# Android Gradle Plugin. Solo se aplica si se activan los targets moviles.
#
# AGP 9 en lugar de 8.x: aporta `com.android.kotlin.multiplatform.library`, el
# plugin que integra el target de Android DENTRO del bloque `kotlin {}` de un
# modulo KMP. Con AGP 8 habia que aplicar `com.android.library` aparte, que no
# soporta KMP de forma nativa. Verificado contra el ejemplo de PuertoNuevoApp,
# que ya usa AGP 9 en produccion.
androidGradlePlugin = "9.1.1"
androidMinSdk = "24"
androidCompileSdk = "36"

# Compose Multiplatform para la UI compartida de Android e iOS.
composeMultiplatform = "1.11.1"
# Material 3 de Compose Multiplatform. Es alpha porque es la version que usa el
# ejemplo real y de la que dependen los tokens del design system; la estable
# equivalente (1.9.x) no expone algunos de los que se usan aqui.
composeMaterial3 = "1.11.0-alpha07"
# Iconos extendidos. Se queda en 1.7.3 A PROPOSITO: es lo que fija el ejemplo
# real, que ya compila en produccion con Compose 1.11. Las lineas 1.8+ reescriben
# el catalogo de iconos y no aportan nada que este design system use.
composeMaterialIcons = "1.7.3"
# ViewModel y collectAsStateWithLifecycle multiplataforma: es lo que da ViewModel
# a iOS, requisito de PLAN §3.4. Aun en beta en la linea 2.11.
androidxLifecycle = "2.11.0-beta01"
# Activity + Compose, solo para el entry point de androidApp.
androidxActivityCompose = "1.13.0"

# Camara y lectura de codigos de barras, solo en androidMain.
androidxCamera = "1.4.2"
mlkitBarcode = "17.3.0"

# SQLDelight: la persistencia local del movil (catalogo, existencias y cola de
# sincronizacion). Se eligio SQLDelight y no un ORM porque genera el codigo de
# acceso a partir de archivos `.sql` REALES: la migracion se revisa como SQL en
# un diff, y las migraciones versionadas (`.sqm`) son una funcion del plugin, no
# una convencion que haya que recordar.
sqldelight = "2.1.0"
# androidx.datastore: preferencias con escritura atomica en Android. No se usa
# SharedPreferences a mano porque su `apply()` es asincrono y no avisa del fallo:
# con DataStore, guardar es una corrutina que termina o falla, y eso se puede
# probar.
androidxDatastore = "1.1.7"

[libraries]
# ═══════════════════════════════════════════════════════════════════════════
# ATENCIÓN: los nombres de estas claves NO pueden empezar por "kotlin-".
# El version catalog genera un namespace `libs.kotlin.*` para el plugin
# `kotlin`, y una librería `kotlin-coroutines-core` produciría el accessor
# `libs.kotlin.coroutines.core`, que colisiona y rompe el build.
# ═══════════════════════════════════════════════════════════════════════════

# ── Kotlin core: lo ÚNICO que stock-domain puede usar ──────────────────────
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# ── Movil: escaner de codigos de barras ────────────────────────────────────
# La camara y el lector de codigos son de PLATAFORMA, por eso van en androidMain
# y en iosMain; el modelo de que hacer con lo escaneado vive en commonMain.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

# ── Tests: property-based para las invariantes I1-I10 ──────────────────────
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.0" }

# ── Backend: Ktor ──────────────────────────────────────────────────────────
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-request-validation = { module = "io.ktor:ktor-server-request-validation", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }

# ── Backend: Exposed y persistencia ────────────────────────────────────────
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
# Se usa SOLO por sus librerias nativas (macOS, Linux y Windows, x86-64 y ARM).
# El binding de Java de este artefacto no funciona: cualquier hash falla con
# «Output is too short (-2)» aunque la libreria nativa responde 0 = exito.
# Los bindings se escriben a mano sobre el binario. Ver NativeArgon2PasswordHasher.
argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "jwt" }

# ── Móvil: Ktor client ─────────────────────────────────────────────────────
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
# MockEngine: permite probar el cliente HTTP (parseo, paginacion, contrato de
# error y refresh) sin levantar un servidor. Es la unica forma de cubrir el
# camino de error de un cliente sin depender de la red.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# ── Movil: Compose Multiplatform (UI compartida Android + iOS) ─────────────
# Se declaran los artefactos UNO A UNO en lugar de usar `compose.material3` del
# plugin: el DSL del plugin resuelve las versiones por su cuenta y a veces elige
# una de Jetpack (androidx) en vez de la de Compose Multiplatform, que es la que
# trae los targets de iOS. Con la coordenada explicita no hay ambiguedad.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# ── Movil: ViewModel multiplataforma ───────────────────────────────────────
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

# ── Movil: entry point Android ─────────────────────────────────────────────
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

# ── Movil: persistencia local (SQLDelight) ─────────────────────────────────
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
# Driver JDBC (SQLite embebido). Es el de JVM: el backend y los tests.
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

# ── Móvil: preferencias (solo Android; en iOS y JVM no hace falta) ─────────
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# Plugin de Android para modulos KMP (AGP 9). Reemplaza a `com.android.library`,
# que no soporta Kotlin Multiplatform de forma nativa.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
# Genera el codigo Kotlin de acceso a partir de los `.sq` y aplica los `.sqm`.
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
