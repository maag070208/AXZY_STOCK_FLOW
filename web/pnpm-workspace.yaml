# Build scripts permitidos explícitamente.
#
# pnpm 10 bloquea los scripts de instalación por defecto (riesgo de cadena de
# suministro). Estos tres son necesarios para que el build funcione: `@swc/core`
# y `esbuild` compilan/transforman, y `unrs-resolver` es la parte nativa del
# resolver de TypeScript que usa eslint-plugin-boundaries.
allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
