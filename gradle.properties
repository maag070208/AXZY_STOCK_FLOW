# El compilador de Kotlin corre dentro del proceso de Gradle: un daemon menos que arrancar.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=summary
# El JDK 25 de la API lo descarga el propio Gradle (plugin foojay en settings.gradle.kts):
# para compilar basta con tener un JDK 17 o superior para arrancar Gradle.
org.gradle.java.installations.auto-download=true
