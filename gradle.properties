# ============================================================================
# Propiedades del build
# ============================================================================

# ── Daemon de Kotlin ───────────────────────────────────────────────────────
# El daemon escribe archivos temporales en el directorio de usuario
# (~/Library/Application Support/kotlin/daemon). En entornos con sandbox de
# escritura eso falla y la compilación cae al modo "sin daemon", que es más
# lento y produce mensajes de error confusos.
#
# Redirigir estos directorios al workspace mantiene el build reproducible y
# evita depender de rutas de usuario.
# El daemon de Kotlin escribe marcadores temporales en el directorio de usuario
# (~/Library/Application Support/kotlin/daemon) y el sandbox de escritura lo
# bloquea. Se desactiva: el dominio compila en segundos sin daemon, y así el
# build no depende de rutas fuera del proyecto.
kotlin.compiler.execution.strategy=in-process

# ── Kotlin ─────────────────────────────────────────────────────────────────
# Compilación incremental: acelera muchísimo el ciclo de TDD del dominio.
kotlin.incremental=true

# ── JVM ────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# ── Calidad ────────────────────────────────────────────────────────────────
# Los warnings de código no usado no deben romper el build durante el TDD,
# pero sí queremos verlos.
org.gradle.warning.mode=summary
