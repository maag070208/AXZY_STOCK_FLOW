name: Fase 0 — Dominio y arquitectura

# ============================================================================
# Puertas de calidad de la Fase 0.
#
# La más importante es la GUARDIA DE ARQUITECTURA: falla el build si
# `stock-domain` llega a depender de un framework. Sin ella, la regla se rompe
# en la primera prisa —alguien necesita una utilidad de Exposed, la añade, y el
# dominio deja de poder compartirse con el móvil— y con ello se pierde la razón
# por la que el backend y el cliente toman decisiones idénticas.
#
# El legacy no tenía ni un solo test: la única especificación de su
# comportamiento era el código. Ese es el defecto que estas puertas evitan.
# ============================================================================

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dominio:
    name: Dominio (Kotlin puro)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── La guardia corre PRIMERO y sola ───────────────────────────────────
      # Va antes que los tests a propósito: si el dominio se contaminó de un
      # framework, el problema es estructural y no tiene sentido gastar minutos
      # compilando el resto.
      - name: Guardia de arquitectura
        run: ./gradlew :stock-domain:verifyDomainPurity :stock-domain:forbidJvmMainSourceSet --console=plain

      - name: Tests del dominio e invariantes
        run: ./gradlew :stock-domain:check --console=plain

      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-dominio
          path: stock-domain/build/reports/tests/
          retention-days: 7

  escaneo-de-secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: un secreto borrado en un commit posterior
          # sigue estando en el historial y sigue siendo un secreto expuesto.
          fetch-depth: 0

      # El hallazgo S5 del legacy era exactamente esto: credenciales en el
      # repositorio (SQL Server, MySQL, el usuario admin/admin12345). Esta
      # puerta impide que el defecto se repita en el sistema nuevo.
      - name: Buscar credenciales en el repositorio y su historial
        run: |
          set -euo pipefail
          PATRONES='(password|passwd|secret|api[_-]?key|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}'
          echo "Buscando credenciales en el historial completo…"
          if git log --all -p --no-color \
             | grep -nEi "$PATRONES" \
             | grep -vEi 'CAMBIA_ESTO|placeholder|ejemplo|example|tu_|xxx|\*\*\*|redacted|test|fake|dummy' \
             | head -20; then
            echo "::error::Se encontraron posibles credenciales en el historial del repositorio."
            exit 1
          fi
          echo "✓ Sin credenciales detectadas"

      - name: Verificar que .env no esté versionado
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Hay un archivo .env versionado. Los secretos no van al repositorio."
            exit 1
          fi
          if ! git ls-files | grep -q 'infra/.env.example'; then
            echo "::error::Falta infra/.env.example: es la plantilla que sí debe versionarse."
            exit 1
          fi
          echo "✓ .env ignorado y .env.example presente"

  migraciones:
    name: Migraciones SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stock_test
          POSTGRES_USER: stock_app
          POSTGRES_PASSWORD: clave_de_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stock_app -d stock_test -q"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Aplicar las migraciones DESDE CERO es la única forma de saber que un
      # despliegue limpio funciona. El legacy tenía 36 migraciones legacy más
      # una que recreaba todo el esquema: su historial no reconstruía la base.
      - name: Aplicar las migraciones desde cero
        env:
          PGPASSWORD: clave_de_ci
        run: |
          set -euo pipefail
          for archivo in backend/src/main/resources/db/migration/V*.sql; do
            echo "── Aplicando $(basename "$archivo")"
            psql -h localhost -U stock_app -d stock_test -v ON_ERROR_STOP=1 -q -f "$archivo"
          done
          echo "✓ Todas las migraciones aplican desde cero"

      - name: Verificar las invariantes del esquema de auditoría
        env:
          PGPASSWORD: clave_de_ci
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U stock_app -d stock_test -tAq"

          # El ledger de auditoría debe estar particionado.
          particiones=$($PSQL -c "SELECT count(*) FROM pg_inherits WHERE inhparent='audit_log'::regclass;")
          if [ "$particiones" -lt 2 ]; then
            echo "::error::audit_log debe estar particionada (encontradas $particiones particiones)."
            exit 1
          fi

          # La inmutabilidad debe estar aplicada POR PARTICIÓN. Un trigger en el
          # padre de una tabla particionada NO se aplica a las particiones: ese
          # error daba una falsa sensación de protección.
          triggers=$($PSQL -c "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname LIKE 'no_%';")
          if [ "$triggers" -lt 4 ]; then
            echo "::error::Faltan triggers de inmutabilidad por partición ($triggers)."
            exit 1
          fi

          # La auditoría debe ser inmutable de verdad.
          if $PSQL -c "INSERT INTO audit_log (business_date, source_channel, entity_type, action, action_level, permission_key, access_trace, record_hash, actor_user_id) VALUES (CURRENT_DATE,'WEB','kardex','X','CRITICAL','inventory.move','{}','h',NULL);" 2>/dev/null; then
            if $PSQL -c "DELETE FROM audit_log;" 2>/dev/null; then
              echo "::error::audit_log aceptó un DELETE: la auditoría que se puede editar no es auditoría."
              exit 1
            fi
          fi

          echo "✓ Esquema de auditoría: particionado, inmutable y con triggers por partición"

  # ==========================================================================
  # APK DE ANDROID — PASO SEPARADO Y OBLIGATORIO
  #
  # `mobile-app/androidApp` es un build de Gradle INDEPENDIENTE, porque con
  # AGP 9 `com.android.application` y el plugin de KMP no pueden coexistir en el
  # mismo build y el fallo tumba la configuración de todo el monorepo.
  #
  # Consecuencia que hay que cubrir explícitamente: el APK **no participa** en
  # `./gradlew build` de la raíz. Sin este job, el CI pasaría en verde con el APK
  # sin compilar, y esa omisión es SILENCIOSA. Ver PLAN_ALMACEN_INTEGRAL.md §10-bis.
  # ==========================================================================
  apk-android:
    name: APK de Android (build aparte)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Compilar el APK de depuración
        working-directory: mobile-app/androidApp
        run: ./gradlew :assembleDebug --console=plain

      - name: Comprobar que el APK existe y no está vacío
        # No basta con que Gradle diga OK: un APK de 0 bytes también daría éxito.
        run: |
          set -euo pipefail
          APK=$(find mobile-app/androidApp/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No se generó ningún APK. El build de androidApp está roto o no se ejecutó."
            exit 1
          fi
          TAMANO=$(stat -c%s "$APK")
          echo "APK: $APK ($TAMANO bytes)"
          if [ "$TAMANO" -lt 1000000 ]; then
            echo "::error::El APK pesa $TAMANO bytes: parece incompleto."
            exit 1
          fi
          echo "✓ APK generado y con tamaño plausible"
