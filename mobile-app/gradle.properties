# ============================================================================
# Propiedades del build de `mobile-app`
#
# ESTE ARCHIVO ES NECESARIO PORQUE ESTE ES UN BUILD PROPIO: Gradle lee el
# `gradle.properties` del directorio raíz DEL BUILD, y la raíz de este build es
# `mobile-app/`, no el monorepo. Sin él Gradle usa sus valores por defecto
# (512 MiB de heap, 384 MiB de metaspace) y el build muere con
#
#   «Daemon is stopping immediately since the JVM garbage collector is thrashing and
#    after running out of JVM Metaspace»
#
# Esto no es una optimización: es el mínimo para que compile. Componer un framework
# de Compose Multiplatform más AGP más Kotlin no cabe en los valores por defecto.
# Los números son los mismos que los del `gradle.properties` de la raíz del
# monorepo, para que el comportamiento sea el mismo se compile desde donde se
# compile.
#
# ANTES ESTE ARCHIVO VIVÍA EN `androidApp/gradle.properties`, porque `androidApp`
# era el único módulo de este directorio que formaba un build de Gradle. Al pasar
# a ser un build único (`shared` + `androidApp`), las propiedades se suben a la
# raíz: un `gradle.properties` por módulo no existe en Gradle.
# ============================================================================

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.warning.mode=summary

android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Almacén de claves de depuración (sandbox) ──────────────────────────────
# AGP crea el keystore de depuración en `~/.android/debug.keystore`. En este entorno
# `~/.android` no es escribible (el sandbox lo bloquea), así que la firma del APK de
# depuración falla con «Unable to create debug keystore ... because it is not
# writable». Se redirige al workspace, que sí lo es.
#
# El keystore de depuración no es un secreto: es una clave pública conocida que solo
# sirve para instalar en un dispositivo de pruebas. Cuando se firme una release, la
# clave irá en un almacén de verdad y fuera del repositorio.
android.debugKeystorePath=/Users/axzy/DEV/STOCK/.gradle-home/debug.keystore
